
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Kalkulator Sederhana</title>
</head>
<body>

    <h1>Kalkulator Sederhana</h1>

    <button onclick="hitung()">Mulai Kalkulator</button>

    <script>
        function hitung() {
            // Meminta angka pertama
            let input1 = prompt("Masukkan angka pertama:");

            if (input1 === null || input1.trim() === "") {
                alert("Input angka pertama dibatalkan atau kosong!");
                return;
            }

            let angka1 = Number(input1);

            if (!Number.isFinite(angka1)) {
                alert("Angka pertama tidak valid!");
                return;
            }

            // Meminta operator
            let operator = prompt(
                "Pilih operator:\n" +
                "+ untuk Penjumlahan\n" +
                "- untuk Pengurangan\n" +
                "* untuk Perkalian\n" +
                "/ untuk Pembagian"
            );

            if (operator === null) {
                alert("Perhitungan dibatalkan!");
                return;
            }

            operator = operator.trim();

            // Meminta angka kedua
            let input2 = prompt("Masukkan angka kedua:");

            if (input2 === null || input2.trim() === "") {
                alert("Input angka kedua dibatalkan atau kosong!");
                return;
            }

            let angka2 = Number(input2);

            if (!Number.isFinite(angka2)) {
                alert("Angka kedua tidak valid!");
                return;
            }

            let hasil;

            // Melakukan perhitungan
            switch (operator) {
                case "+":
                    hasil = angka1 + angka2;
                    break;

                case "-":
                    hasil = angka1 - angka2;
                    break;

                case "*":
                    hasil = angka1 * angka2;
                    break;

                case "/":
                    if (angka2 === 0) {
                        alert("Tidak bisa membagi dengan nol!");
                        return;
                    }

                    hasil = angka1 / angka2;
                    break;

                default:
                    alert("Operator tidak valid!");
                    return;
            }

            // Menampilkan hasil tanpa kolom input
            alert(
                "Hasil Perhitungan:\n" +
                angka1 + " " + operator + " " +
                angka2 + " = " + hasil
            );
        }
    </script>

</body>
</html>
